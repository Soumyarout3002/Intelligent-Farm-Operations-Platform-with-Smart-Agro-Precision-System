spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/farmverse_nexus}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Farm document storage
app.upload.dir=uploads/farm-documents

# Maximum uploaded file size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application Email Configuration
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_USERNAME:}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}