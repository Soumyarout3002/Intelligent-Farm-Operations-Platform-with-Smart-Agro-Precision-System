spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/farmverse_nexus}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Farm document storage
app.upload.dir=uploads/farm-documents

# Maximum uploaded file size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# First Admin bootstrap secret (set ADMIN_SETUP_SECRET in the backend environment)
app.admin.setup-secret=${ADMIN_SETUP_SECRET:}
